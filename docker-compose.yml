services:
  localstack:
    container_name: "${LOCALSTACK_DOCKER_NAME:-localstack-main}"
    image: ${LOCALSTACK_IMAGE:-localstack/localstack-custom}
    ports:
      - "127.0.0.1:4566:4566" # LocalStack Gateway
      - "127.0.0.1:4510-4559:4510-4559" # external services port range
    environment:
      # LocalStack configuration: https://docs.localstack.cloud/references/configuration/
      - DEBUG=${DEBUG:-0}
      - PERSISTENCE=${PERSISTENCE:-0}
      # OrbStack auto-domain (<container>.<project>.orb.local) + UI sidecar + outros origins via env
      - EXTRA_CORS_ALLOWED_ORIGINS=${EXTRA_CORS_ALLOWED_ORIGINS:-https://localstack.localstack.orb.local,http://localstack.localstack.orb.local,http://localhost:4577,http://127.0.0.1:4577}
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./volume}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
      # Init hooks (ready.d) — cria buckets default p/ evitar 404 NoSuchBucket em dev
      - "./localstack-init:/etc/localstack/init"
  localstack-ui:
    container_name: localstack-ui
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:4577:80"
    volumes:
      - "./localstack-ui:/usr/share/nginx/html:ro"
    depends_on:
      - localstack
    restart: unless-stopped
  localstack-tls:
    container_name: localstack-tls
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:4569:4569"
    volumes:
      - "./localstack-tls/nginx.conf:/etc/nginx/nginx.conf:ro"
      - "./localstack-tls/certs:/etc/nginx/certs:ro"
    depends_on:
      - localstack
    restart: unless-stopped
