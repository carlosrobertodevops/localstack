worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    # Resolve service names dynamically (Docker DNS).
    resolver 127.0.0.11 ipv6=off valid=30s;

    # Allow large IaC snippet bodies (up to 256KB; backend caps at 64KB).
    client_max_body_size 1m;

    # Upstream targets are read from env so the sidecar works on any compose project.
    map $host $localstack_upstream { default http://localstack:4566; }
    map $host $bridge_upstream     { default http://host.docker.internal:4578; }

    server {
        listen      80 default_server;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        gzip on;
        gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

        # Console + cloud-registry endpoints proxied to LocalStack edge.
        location /_localstack/ {
            proxy_pass         $localstack_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;

            # Never cache LocalStack meta endpoints — service health flips.
            add_header Cache-Control "no-store, must-revalidate" always;
            add_header Pragma        "no-cache"                  always;
            expires    off;
        }

        # AWS SDK / signed traffic also goes through the edge gateway.
        location ~ ^/(2015-|2016-|s3|sqs|dynamodb|lambda|sns)/ {
            proxy_pass         $localstack_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 600s;
        }

        # Host-side CLI bridge (foreground via `make console-bridge`).
        location /_bridge/ {
            rewrite ^/_bridge/(.*)$ /$1 break;
            proxy_pass         $bridge_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 600s;
        }

        # Legacy painel.
        location = /legacy.html {
            try_files /legacy.html =404;
        }

        # SPA fallback (TanStack Router).
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
